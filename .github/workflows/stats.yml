name: stats
# Holt alle 3 Stunden Aufrufe, Likes und Abonnenten von YouTube fuer die App.
on:
  schedule:
    - cron: "29 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: state
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # neuesten Stand holen, nicht den beim Ausloesen
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: YouTube-Schluessel entschluesseln
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: |
          if [ ! -f youtube-token.enc ]; then echo "YouTube nicht verbunden, nichts zu tun."; exit 0; fi
          t=$(openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in youtube-token.enc -pass env:TOKEN_KEY)
          echo "::add-mask::$t"
          echo "YT_REFRESH_TOKEN=$t" >> "$GITHUB_ENV"
      - name: Statistiken abrufen
        if: env.YT_REFRESH_TOKEN != ''
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: python clipper.py stats
      - name: Stand speichern
        run: |
          python clipper.py export
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          for f in state.sqlite docs/data.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m "stats: YouTube-Zahlen aktualisiert"
          git pull --rebase && git push

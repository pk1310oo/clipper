name: publish
# Arbeitet queue/*.json ab: herunterladen, hochkant schneiden, auf YouTube hochladen.
on:
  push:
    branches: [main]
    paths: ["queue/**"]
  schedule:
    - cron: "43 9 * * *"   # taeglich, falls am Vortag das Tageslimit erreicht war
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: state
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q yt-dlp
      - name: YouTube-Schluessel entschluesseln
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: |
          if [ -f youtube-token.enc ]; then
            t=$(openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in youtube-token.enc -pass env:TOKEN_KEY)
            echo "::add-mask::$t"
            echo "YT_REFRESH_TOKEN=$t" >> "$GITHUB_ENV"
          fi
      - name: Warteschlange abarbeiten
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: python clipper.py publish-queue
      - name: Stand speichern
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          python clipper.py export
          git add -A queue docs/data.json; if [ -e state.sqlite ]; then git add state.sqlite; fi
          git diff --cached --quiet || git commit -m "publish: Warteschlange abgearbeitet"
          git pull --rebase && git push

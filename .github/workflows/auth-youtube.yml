name: auth-youtube
# Einmalige Anmeldung des YouTube-Kanals. Von Hand starten, dann im Log den Code ablesen.
# Der Schluessel landet als Artefakt "youtube-token" (1 Tag gespeichert), nie im Log.
on:
  workflow_dispatch:
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Anmelden
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: python clipper.py auth-youtube --out youtube-token.txt
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-token
          path: youtube-token.txt
          retention-days: 1

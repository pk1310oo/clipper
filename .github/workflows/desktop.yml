name: desktop
# Baut die Mac-App (Universal: Apple Silicon und Intel) und stellt die .dmg als Release bereit.
on:
  push:
    branches: [main]
    paths: ["desktop/**", "docs/index.html", "docs/icon.svg", ".github/workflows/desktop.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm install --no-audit --no-fund
      - name: Bauen
        run: npx tauri build --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: clipper-mac
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Version lesen
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Als Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.ver.outputs.version }}
          name: Clipper ${{ steps.ver.outputs.version }} (Mac)
          overwrite_files: true
          files: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

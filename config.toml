# Einstellungen. Keine Zugangsdaten hier eintragen, die liegen als GitHub-Secrets.

[scan]
lookback_hours = 48     # wie weit zurueck nach Clips gesucht wird
min_views = 1000        # nur Clips, die schon Zugkraft zeigen (grosse Streamer)
min_seconds = 8
max_seconds = 60
game_ids = []           # Twitch-Kategorie-IDs, leer = alle Spiele des Streamers

[render]
max_seconds = 59        # Shorts/Reels-Grenze
font = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

[upload]
privacy = "private"     # erst auf "public" stellen, wenn Googles API-Pruefung durch ist
max_per_day = 5
language = "en"

[earnings]
rate_per_1000 = 1.0     # Verguetung pro 1.000 Aufrufe (z. B. Kampagnenrate), nur fuer die Schaetzung in der App

# Ein Block pro Streamer. Ohne permission_proof wird der Streamer uebersprungen.
# Zum Freischalten den Link zur Kampagne oder Freigabe bei permission_proof eintragen.

[[streamer]]
login = "kaicenat"
permission_proof = ""
note = "Kampagne auf Whop Content Rewards beitreten, dann den Kampagnen-Link eintragen."

